experiences:
  title: Experience
  info:
  - role: Junior Research Fellow of Ancient DNA
    time: November 2021 - Present
    company: Estonian Biocentre, Institute of Genomics, University of Tartu
    details: |
      The main objective of the doctoral project is to assess the impact of cultural 
      differences on the quantitative and qualitative structure of the oral microbiome 
      within groups of European populations, from the Neolithic to post-industrial period .
      Development of wet lab protocols for aDNA and proteins extraction from ancient dental calculus 
      and other substrates and analysis of ancient metagenomics sequencing data using in-house and 
      published pipelines.
  - role: Visiting Scholar
    time: June - August 2025
    company: microARCH Lab, Department of Anthropology, The Pennsilvania State University
    details: |
      Internship program:
      Learning how to use the in-house pipeline for the analysis of shotgun metagenomics data;
      Learning how to conduct multivariate statistical analysis on data from ancient and modern dental calculus;
      Collaborating on ongoing projects.
  - role: Erasmus+ Trainee
    time: April - July 2021
    company: Estonian Biocentre, Institute of Genomics, University of Tartu
    details: |
      Introduction to Ancient DNA Methods
      Traineeship Program: Learn how to produce ancient DNA NGS data from skeletal materials 
      by working in the ancient DNA lab alongside the lab technician; learn basic bioinformatic 
      analysis for processing DNA NGS data. The work was mainly focused on ancient dental calculus samples.
  - role: Research Assistant
    time: February - April 2021
    company: Sapienza University of Rome
    details: |
      Postgraduate Research Scholarship funded by the Pasteur Institute Italy-Cenci Bolognetti Foundation
      The project involved the analysis of experimental data generated through Next- Generation Sequencing (NGS).
  - role: Paid intern at Sapienza Museum Network (Polo Museale)
    time: 2018 - 2019
    company: Sapienza University of Rome
    details: |
      The activity included support of structured staff during events and conventions in which the 
      University was involved, the organisation of events related with the Museums of the University as well 
      as the development and maintenance of the website of the Museum Network (Polo Museale) of Sapienza University.
  - role: Paid intern at Sapienza Anthropology Museum
    time: 2017 - 2018
    company: Sapienza University of Rome
    details: |
      The work activity was carried out at the Museum of Anthropology, Department of Environmental Biology 
      and involved creating a digital catalogue of bone specimens and materials, as well as conducting guided 
      tours within the museum.


projects:
  title: Projects
  intro: >
    Here, a list of the main projects I have been collaborating to in these years.
  assignments:
  - title: "Estonian Roots: Centre of Excellence for transdisciplinary studies on ethnogenesis and cultural diversity"
    link: "https://sisu.ut.ee/eestijuured/"
    tagline: "Role: Produce and analyse ancient metagenomics data from dental calculus."
  - title: "Making Ancestors: The Politics of Death in Prehistoric Europe"
    link: "https://www.theancestorsproject.org/"
    tagline: "Role: Extract and analyze aDNA and proteins from ancient dental calculus; Perform target enrichment for Yersinia pestis; Perform pilot study for protocol development; Coordinate samples shipments between partners."
  - title: Tobacco Health and History project
    link: "https://www.tobaccohealthhistory.co.uk/"
    tagline: "Role: Collaborator of the project. Extract DNA from ancient dental calculus; analyze data from ancient and modern dental calculus."
  - title: "Ancient DNA protocol collection – University of Tartu, Institute of Genomics"
    link: "https://dx.doi.org/10.17504/protocols.io.n92ldzbd8v5b/v1"
    tagline: "Collaborated in the writing and checking of some of the protocols in the collection. Ongoing project."


