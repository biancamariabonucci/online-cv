career-profile:
  title: Career Profile
  summary: |
   Biancamaria is a Doctoral Researcher in the Archaeogenomics group, 
   in the Estonian Biocentre (Institute of Genomics, University of Tartu). 
   Her main interest is to assess the impact of cultural differences and habits on the quantitative 
   and qualitative structure of the oral microbiome within groups of modern and ancient European populations, 
   from the Neolithic to post-industrial period, through the analysis of ancient DNA (aDNA) and proteins from 
   dental calculus. She also works on projects that focus on the study of the spread of diseases. She is involved 
   in the development of new wet lab protocols for aDNA studies.
